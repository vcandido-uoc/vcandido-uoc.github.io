
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Comparador de Vueltas</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { background-color: black; color: white; font-family: Arial; }
        .controls { margin-bottom: 20px; }
        .controls select, .controls label { margin-right: 10px; }
    </style>
</head>
<body>
    <h1>Comparador de Vueltas</h1>
    <div class="controls">
        <label for="refLap">Vuelta de referencia:</label>
        <select id="refLap"></select>
        <label for="laps">Vueltas a comparar:</label>
        <span id="lapCheckboxes"></span>
    </div>
    <div id="graph"></div>

    <script>
    let dataJson;
    fetch("vueltas_data.json")
        .then(response => response.json())
        .then(data => {
            dataJson = data;
            const refSelect = document.getElementById("refLap");
            const checkboxesDiv = document.getElementById("lapCheckboxes");

            data.laps.forEach(lap => {
                const option = document.createElement("option");
                option.value = lap;
                option.textContent = "Lap " + lap;
                refSelect.appendChild(option);

                const label = document.createElement("label");
                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.value = lap;
                checkbox.checked = true;
                label.appendChild(checkbox);
                label.appendChild(document.createTextNode("Lap " + lap));
                checkboxesDiv.appendChild(label);
            });

            function updatePlot() {
                const refLap = refSelect.value;
                const selectedLaps = Array.from(checkboxesDiv.querySelectorAll("input:checked"))
                                          .map(cb => cb.value);

                const traces = [];

                selectedLaps.forEach(lap => {
                    const delta = lap === refLap ? Array(data.distance.length).fill(0) :
                        dataJson.delta[lap].map((val, i) =>
                            dataJson.delta[refLap][i] !== undefined
                                ? parseFloat(dataJson.delta[lap][i]) - parseFloat(dataJson.delta[refLap][i])
                                : null);

                    traces.push({
                        x: data.distance, y: delta, mode: 'lines', name: `Δ Lap ${lap}`,
                        xaxis: 'x', yaxis: 'y1'
                    });
                    traces.push({
                        x: data.distance, y: data.speed[lap], mode: 'lines', name: `Speed ${lap}`,
                        xaxis: 'x', yaxis: 'y2', showlegend: false
                    });
                    traces.push({
                        x: data.distance, y: data.acceleration[lap], mode: 'lines', name: `Accel ${lap}`,
                        xaxis: 'x', yaxis: 'y3', showlegend: false
                    });
                    traces.push({
                        x: data.distance, y: data.gear[lap], mode: 'lines', name: `Gear ${lap}`,
                        xaxis: 'x', yaxis: 'y4', showlegend: false
                    });
                });

                Plotly.newPlot('graph', traces, {
                    template: 'plotly_dark',
                    hovermode: 'x',
                    height: 1000,
                    xaxis: {title: 'Distancia escalada (km)', domain: [0.0, 1.0]},
                    yaxis: {title: 'Delta (s)', domain: [0.75, 1]},
                    yaxis2: {title: 'Velocidad (km/h)', domain: [0.5, 0.75]},
                    yaxis3: {title: 'Aceleración (g)', domain: [0.25, 0.5]},
                    yaxis4: {title: 'Marcha', domain: [0.0, 0.25]},
                });
            }

            refSelect.addEventListener("change", updatePlot);
            checkboxesDiv.addEventListener("change", updatePlot);
            updatePlot();
        });
    </script>
</body>
</html>
